<!DOCTYPE html>
<html>

<head>
  <title>Homepage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body {
      background-color: #1a1b26;
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    ::-webkit-scrollbar {
      display: none;
    }
    a, p {
      font-family: "FiraCode Nerd Font Propo Bold";
      font-size: 24px;
      text-align: center;
      color: #f7768e;
      line-height: 1.35;
      margin-top: 0;
      margin-bottom: 0;
      text-decoration: none;
    }
    a:hover {
      color: #7aa2f7;
    }
    .search {
      color: #e0af68;
      font-weight: bold;
    }
    .search:hover {
      background-color: #e0af68;
    }

    div {
      margin: auto;
      width: 50%;
      text-align: center;
    }
    .ascii {
      color: #7aa2f7;
      font-family: "Press Start 2P", "FiraCode Nerd Font", monospace;
      font-size: 32px;
      letter-spacing: 4px;
      text-transform: uppercase;
      line-height: 1.4;
      white-space: pre;
      display: inline-block;
      text-align: center;
    }
    .links {
      margin-top: 60px;
    }
    .links a {
      margin: 0 15px;
      font-size: 32px;
    }
  </style>
</head>

<body>
  <br><br><br>
  <div class="icon">
    <pre class="ascii">qutebrowser</pre>
  </div>
  <br><br>
  <div class="links">
    <a class="search" href="https://duckduckgo.com" target="_blank" rel="noopener noreferrer">[o] Search</a>
  </div>
</body>

</html>
